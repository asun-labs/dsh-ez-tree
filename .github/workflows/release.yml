name: Verify and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: '发布本次 CI 验证的完整发行物（已有 Release 将拒绝覆盖）'
        type: boolean
        default: false
      release_tag:
        description: '需要发布的现有版本标签，如 v0.1.0'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e "if(process.env.GITHUB_REF_NAME !== 'v'+require('./package.json').version) process.exit(1)"
      - run: npm run check
      - name: Package and verify Windows or macOS desktop
        if: runner.os != 'Linux'
        run: node scripts/package-desktop.mjs --skip-build
      - name: Prepare Linux display
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Package and verify Linux desktop
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/package-desktop.mjs --skip-build
      - name: Save platform manifest
        if: runner.os != 'macOS'
        shell: bash
        run: node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('releases/runtime.json'));const k=process.platform+'-'+process.arch;fs.writeFileSync('dist/runtime-${{ runner.os }}.json',JSON.stringify({...r,platforms:{[k]:r.platforms[k]}}));"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            dist/*.zip
            dist/runtime-*.json
            .build/packaged-verify/verification.json
            .build/packaged-verify/editor.png
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - name: Require matching release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node -e "if(process.env.RELEASE_TAG !== 'v'+require('./package.json').version) process.exit(1)"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Combine verified manifests
        run: |
          node --input-type=module <<'JS'
          import {readdir, readFile, writeFile} from 'node:fs/promises';
          const merged = {appId:'com.asun-labs.ez-tree', version:JSON.parse(await readFile('package.json')).version, platforms:{}};
          for(const name of (await readdir('dist')).filter(name=>/^runtime-.*\.json$/.test(name))) {
            const current=JSON.parse(await readFile('dist/'+name));
            if(current.appId!==merged.appId||current.version!==merged.version)throw Error('版本不一致');
            Object.assign(merged.platforms,current.platforms);
          }
          await writeFile('releases/runtime.json',JSON.stringify(merged,null,2)+'\n');
          JS
      - run: npm run build
      - run: node scripts/pack.mjs --skip-build
      - name: Build checksums and release notes
        shell: bash
        run: |
          cp releases/runtime.json dist/runtime.json
          cd dist
          sha256sum *.zip *.tgz runtime.json > SHA256SUMS
          printf '%s\n' '完整独立编辑器、Seal 插件、MCP 与技能。' 'Windows 与 Linux 已在本次 CI 中验证真实打包实例。macOS 完成独立应用验证，Seal 安装适配尚未发布。' > RELEASE-NOTES.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/*.tgz dist/runtime.json dist/SHA256SUMS --title "EZ Tree $RELEASE_TAG" --notes-file dist/RELEASE-NOTES.md
